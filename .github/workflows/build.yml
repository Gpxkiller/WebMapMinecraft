name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - run: cmake -S seed -B seed/build && cmake --build seed/build --parallel 2
      - run: python3 -m py_compile seed/worker.py
      - run: node --check src/main/resources/web/app.js
      - run: node tests/cache.cjs
      - run: python3 tests/seed_smoke.py seed/build/libgpxbiomes.so
      - uses: actions/upload-artifact@v4
        with:
          name: WebMapMinecraft
          path: target/*.jar
