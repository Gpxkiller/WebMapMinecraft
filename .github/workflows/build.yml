name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - run: cmake -S seed -B seed/build && cmake --build seed/build --parallel 2
      - run: python3 -m py_compile seed/worker.py
      - run: node --check src/main/resources/web/app.js
      - run: node tests/cache.cjs
      - run: python3 tests/seed_smoke.py seed/build/libgpxbiomes.so
      - uses: actions/upload-artifact@v4
        with:
          name: WebMapMinecraft
          path: target/*.jar
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WebMapMinecraft
          path: dist
      - name: Publish tested initial release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.jar --title "WebMapMinecraft $RELEASE_TAG" --prerelease --notes "Version initiale expérimentale. Carte privée en lecture seule ; aperçu arithmétique facultatif sans génération de chunks. Lire README et VALIDATION avant installation. Java 25+, Paper 26.3. Aucune donnée de serveur incluse."
